<app-head-bar></app-head-bar>

<main>
  <app-search-bar [autos]="autoList" (onSelectCar)="handleSelectCar($event)"></app-search-bar>
</main>

@if (selectedCar) {
  <div class="overlay" (click)="closeCar()">
    <article class="detail" (click)="$event.stopPropagation()">
      <button class="close" type="button" aria-label="Close" (click)="closeCar()">×</button>
      <img [src]="'images/images/' + selectedCar.photo"
           [alt]="selectedCar.brand + ' ' + selectedCar.model">
      <div class="detail-body">
        <h2>{{ selectedCar.brand }} {{ selectedCar.model }}</h2>
        <p class="detail-price">{{ selectedCar.price | number }} DNT</p>
        <div class="chips">
          <span>Power: {{ selectedCar.power }}</span>
          <span>{{ selectedCar.availability }} in stock</span>
        </div>
        <p class="detail-desc">{{ selectedCar.description }}</p>
      </div>
    </article>
  </div>
}
